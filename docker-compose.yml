services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-animes
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
#      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-animes
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DB_USER: ${APP_USER}
      DB_PASSWORD: ${APP_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=${DB_NAME};Username=${APP_USER};Password=${APP_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - anime_images:/app/Api/wwwroot/uploads/animes
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
    container_name: web-animes
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ApiBaseUrl: http://api:8080/
      PublicApiBaseUrl: http://localhost:8080/
      IPAdress: http://${IP_SERVER}:8080/
    ports:
      - "81:80"
    restart: always
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  anime_images:
